<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Scrubber{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
    <nav>
        <a class="brand" href="/">Scrubber</a>
        <a href="/">Dashboard</a>
        <a href="/brokers">Brokers</a>
        <a href="/review">Review{% block reviewbadge %}{% endblock %}</a>
        <a href="/profiles">Profiles</a>
    </nav>
</header>
<main>
    {% block body %}{% endblock %}
</main>
<footer>
    <p>Runs entirely on your machine. Requests carry legal weight because you are
    the data subject &mdash; no authorized-agent paperwork needed.</p>
</footer>
</body>
</html>
